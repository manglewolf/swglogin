# Example Nginx configuration for swglogin (reverse proxy to gunicorn)
# Save as /etc/nginx/sites-available/swglogin and symlink to sites-enabled

server {
    listen 80;
    server_name example.com; # change to your domain or IP

    # Increase client body size if you accept uploads
    client_max_body_size 10M;

    access_log /var/log/nginx/swglogin.access.log;
    error_log /var/log/nginx/swglogin.error.log;

    # Proxy requests to gunicorn
    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://127.0.0.1:8000;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
    }

    # Serve static files directly from the repository
    location /static/ {
        alias /srv/swglogin/static/;
        expires 1d;
        add_header Cache-Control "public";
    }

    location /images/ {
        alias /srv/swglogin/static/images/;
        expires 1d;
        add_header Cache-Control "public";
    }

    location /music/ {
        alias /srv/swglogin/static/music/;
        expires 1d;
        add_header Cache-Control "public";
    }

    # Optional: redirect HTTP -> HTTPS (if you configure TLS)
    # Uncomment and configure when TLS is enabled
    # return 301 https://$host$request_uri;
}
