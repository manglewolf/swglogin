# Example drop-in overrides for the swglogin systemd service
# Install this as /etc/systemd/system/swglogin.service.d/override.conf
# Then run: sudo systemctl daemon-reload && sudo systemctl restart swglogin

[Service]
# Override or add environment variables without editing the main unit.
# Point to a custom environment file if you prefer storing values in a file:
# EnvironmentFile=/etc/default/swglogin

# Example inline environment overrides (take care not to expose secrets in world-readable unit files):
# Environment="VENV_PATH=/srv/swglogin/venv"
# Environment="FLASK_ENV=production"
# Environment="FLASK_SECRET_KEY=your_production_secret_here"
# Environment="DB_HOST=127.0.0.1"
# Environment="DB_USER=swglogin"
# Environment="DB_PASS=supersecret"

# Set a specific user/group for the service (if you created a dedicated service user):
# User=swglogin
# Group=swglogin

# Limit resources for the service (optional, tuned for your host):
# CPUQuota=50%
# MemoryMax=200M

# If you need to override ExecStart entirely, you can do it here.
# ExecStart=
# ExecStart=/srv/swglogin/venv/bin/gunicorn --chdir /srv/swglogin -b 127.0.0.1:8000 "app:app"

# If you add EnvironmentFile entries, avoid world-readable files for secrets.

[Install]
# Nothing required here for simple overrides; keep the default install settings.
