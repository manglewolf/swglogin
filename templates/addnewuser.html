<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create a New Account</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='stylesheet.css') }}">
</head>
<body class="form-page registration-page">
  <div class="container registration-form-container">
    <header class="form-header">
      <h1>Register an Account</h1>
    </header>

    <main class="form-main">
      <nav class="form-nav">
        <a href="/index.php" class="btn btn-secondary">Back to Home</a>
      </nav>

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          <div class="messages">
            {% for category, msg in messages %}
              <div class="alert alert-{{ category }}">{{ msg }}</div>
            {% endfor %}
          </div>
        {% endif %}
      {% endwith %}

      <article class="registration-form-wrapper">
        <form id="registration-form" action="/newuserpost" method="post" class="registration-form">
          <div class="form-group">
            <label for="useraccountname">Account Name</label>
            <input type="text" id="useraccountname" name="useraccountname" required aria-required="true">
          </div>
          <div class="form-group">
            <label for="realpassword">Password</label>
            <input type="password" id="realpassword" name="realpassword" required aria-required="true">
          </div>
          <div class="form-group">
            <label for="confirmpassword">Confirm Password</label>
            <input type="password" id="confirmpassword" name="confirmpassword" required aria-required="true">
          </div>
          <div class="form-group">
            <label for="accesslevel">Access Level</label>
            <select id="accesslevel" name="accesslevel">
              <option value="standard">Standard</option>
            </select>
          </div>
          <input type="hidden" name="action" value="create">
          <button type="submit" class="btn btn-primary">Create Account</button>
        </form>

        <div class="form-footer">
          <a href="#" class="btn btn-secondary download-link">Download Client</a>
        </div>
      </article>
    </main>
  </div>

  <script>
    // Validate password match on form submission
    const form = document.getElementById('registration-form');
    if (form) {
      form.addEventListener('submit', (e) => {
        const password = document.getElementById('realpassword').value;
        const confirm = document.getElementById('confirmpassword').value;
        if (password !== confirm) {
          e.preventDefault();
          alert('Password fields must be the same.');
          return false;
        }
      });
    }
  </script>
</body>
</html>
