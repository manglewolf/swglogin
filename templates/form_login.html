<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SWG:Source | Login</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='stylesheet.css') }}">
</head>
<body class="form-page">
  <div class="container login-form-container">
    <header class="form-header">
      <img src="{{ url_for('images', filename='swgsource.png') }}" alt="SWG Source Logo" class="logo">
    </header>

    <main class="form-main">
      <article class="login-form-wrapper">
        <h1>Account Login</h1>
        <form method="post" action="/post_login" class="login-form">
          <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" required aria-required="true">
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required aria-required="true">
          </div>
          <button type="submit" class="btn btn-primary">Login</button>
        </form>
        <p class="form-footer-link"><a href="/index.php">Back to Home</a></p>
      </article>
    </main>
  </div>
</body>
</html>
