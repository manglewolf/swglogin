<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Change Password</title>
    <style>
    /* Styles copied from original */
    div.container { width: 90%; border: none; }
    header, footer { padding: 1em; color: white; text-align: center; }
    nav { float: left; max-width: 160px; margin: 0; padding: 1em; }
    nav ul { list-style-type: none; padding: 0; }
    article { margin-left: 170px; padding: 1em; overflow: hidden; }
  body  { background-color: black; background-image: url("{{ url_for('images', filename='grevious.jpg') }}"); background-repeat: no-repeat; background-attachment: fixed; background-position: center; background-size: cover; }
    a:link { color: green; text-decoration: none; }
    a:visited { color: orange; text-decoration: none; }
    a:hover { color: red; text-decoration: underline; }
    a:active { color: yellow; text-decoration: underline; }
    </style>
  </head>
  <body>
    <center>
      <form action="/post_changepassword" method="post">
        <table>
          <tr>
            <td><b><p style="color:white;">Username</p></b></td>
            <td>
              <select name="username">
                {% for u in users %}
                  <option value="{{ u.username }}" {% if u.username == session.username %}selected{% endif %}>{{ u.username }}</option>
                {% endfor %}
              </select>
            </td>
          </tr>
          <tr>
            <td><b><p style="color:white;">New Password</p></b></td>
            <td><input id="realpassword" type="password" name="password" /></td>
          </tr>
          <tr>
            <td></td>
            <td>
              <input type="hidden" name="action" value="update" />
              <input type="submit" value="Save" id="save" />
            </td>
          </tr>
        </table>
      </form>
    </center>
  </body>
</html>
