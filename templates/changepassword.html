<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Change Password</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='stylesheet.css') }}">
</head>
<body class="form-page password-page">
  <div class="container password-form-container">
    <header class="form-header">
      <h1>Change Password</h1>
    </header>

    <main class="form-main">
      <article class="password-form-wrapper">
        <form action="/post_changepassword" method="post" class="password-form">
          <div class="form-group">
            <label for="username">Username</label>
            <select id="username" name="username" required aria-required="true">
              {% for u in users %}
                <option value="{{ u.username }}" {% if u.username == session.username %}selected{% endif %}>{{ u.username }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="form-group">
            <label for="password">New Password</label>
            <input type="password" id="password" name="password" required aria-required="true">
          </div>
          <input type="hidden" name="action" value="update">
          <button type="submit" class="btn btn-primary">Save Changes</button>
        </form>
        <p class="form-footer-link"><a href="/index.php">Back to Home</a></p>
      </article>
    </main>
  </div>
</body>
</html>
